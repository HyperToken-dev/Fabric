syntax = "proto3";
package proto;
option go_package = "github.com/HyperToken-dev/fabric/gen;proto";

service ModelClientService {
    rpc ListModels(ListClientModelsRequest) returns(ListClientModelsResponse);
}

message ClientModel {
    string model_name = 1;
    int32 model_type = 2;
    string channel_name = 3;
}

message ListClientModelsRequest {
    string channel_name = 1;
}

message ListClientModelsResponse {
    repeated ClientModel models = 1;
}
