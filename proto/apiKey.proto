syntax = "proto3";
package proto;
option go_package = "github.com/HyperToken-dev/fabric/gen;proto";
import "google/protobuf/timestamp.proto";

service ManageApiKeyService {
    rpc CreateApiKey(CreateApiKeyRequest) returns(CreateApiKeyResponse);
    rpc RevokeApiKey(RevokeApiKeyRequest) returns(RevokeApiKeyResponse);
    rpc ListApiKeysByChannelID(ListApiKeysByChannelIDRequest) returns(ListApiKeysResponse);
    rpc ListApiKeysByChannelName(ListApiKeysByChannelNameRequest) returns(ListApiKeysResponse);
}

message CreateApiKeyRequest {
    string key_name = 1;
    int32 channel_id = 2;
}

message CreateApiKeyResponse {
    ApiKey api_key = 1;
}

message RevokeApiKeyRequest {
    string key_hash = 1;
}

message RevokeApiKeyResponse {}

message ListApiKeysByChannelIDRequest {
    int32 channel_id = 1;
}

message ListApiKeysByChannelNameRequest {
    string channel_name = 1;
}

message ListApiKeysResponse {
    repeated ApiKey api_keys = 1;
}

message ApiKey {
    string key_name = 1;
    string key_hash = 2;
    string raw_key = 3; //return once when CreateApiKeyResponse
    google.protobuf.Timestamp created_at = 4;
}
