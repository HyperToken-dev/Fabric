proxyAddr: 3002
adminAddr: 9090
logLevel: info

timeZone: Asia/Shanghai

db:
  addr: postgres
  user: root
  port: 5432
  dbName: fabric
  password: "123456" # important!change your password when needed!
  maxIdle: 20
  maxOpen: 100
  maxLifeTime: 1h

log:
  maxSize: 100
  maxBackups: 10
  maxAge: 30
