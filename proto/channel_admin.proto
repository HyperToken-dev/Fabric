syntax = "proto3";
package proto;
option go_package = "github.com/HyperToken-dev/fabric/gen;proto";
import "google/protobuf/timestamp.proto";

service ChannelAdminService {
    rpc CreateChannel(CreateAdminChannelRequest) returns(AdminChannelResponse);
    rpc ListChannels(ListAdminChannelsRequest) returns(ListAdminChannelsResponse);
    rpc ListActiveChannels(ListAdminActiveChannelsRequest) returns(ListAdminChannelsResponse);
    rpc UpdateChannelName(UpdateAdminChannelNameRequest) returns(AdminChannelResponse);
    rpc UpdateChannelStatus(UpdateAdminChannelStatusRequest) returns(AdminChannelResponse);
    rpc UpdateChannelBaseURL(UpdateAdminChannelBaseURLRequest) returns(AdminChannelResponse);
    rpc UpdateChannelAPIFormat(UpdateAdminChannelAPIFormatRequest) returns(AdminChannelResponse);
    rpc UpdateChannelProviderKey(UpdateAdminChannelProviderKeyRequest) returns(AdminChannelResponse);
}

message AdminChannel {
    int32 channel_id = 1;
    string channel_name = 2;
    google.protobuf.Timestamp created_at = 3;
    int32 status = 4;
    string base_url = 5;
    int32 api_format = 6;
}

message ListAdminChannelsRequest {}

message ListAdminActiveChannelsRequest {}

message ListAdminChannelsResponse {
    repeated AdminChannel channels = 1;
}

message CreateAdminChannelRequest {
    string channel_name = 1;
    string base_url = 2;
    int32 api_format = 3;
    string provider_key = 4;
}

message AdminChannelResponse {
    AdminChannel channel = 1;
}

message UpdateAdminChannelNameRequest {
    int32 channel_id = 1;
    string channel_name = 2;
}

message UpdateAdminChannelStatusRequest {
    int32 channel_id = 1;
    int32 status = 2;
}

message UpdateAdminChannelBaseURLRequest {
    int32 channel_id = 1;
    string base_url = 2;
}

message UpdateAdminChannelAPIFormatRequest {
    int32 channel_id = 1;
    int32 api_format = 2;
}

message UpdateAdminChannelProviderKeyRequest {
    int32 channel_id = 1;
    string provider_key = 2;
}
